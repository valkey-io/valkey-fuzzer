# valkey.replication-partial-resync with replication stream compression: drop
# every replica link under writes and require a PSYNC continuation, which
# re-enables compression after +CONTINUE and before the backlog is sent. The
# primary counts sync_partial_ok without a new full sync, and the
# `compression` oracle requires every link's last session (the PSYNC one) to
# have logged enabling the predicted codec, INFO to report it, and the
# compressor to shrink the repetitive write stream by at least min_ratio.
extends: [valkey.psync, valkey.repl-compression]
id: valkey.repl-compression-partial-resync
metadata:
  description: PSYNC continuation of compressed replication links with codec and ratio evidence
  generator:
    inputs:
      # At most about 2 MB of writes per second, well inside the default 10 MB
      # backlog, so the reconnect is always a partial resync; enough of them
      # that a compressed link of compressible values reaches min_ratio.
      mutation_rate: {minimum: 100, maximum: 2000}
      value_size: {values: [256, 512, 1024]}
      run_after_resync_s: {minimum: 0.5, maximum: 3}
      min_ratio: {hook: valkey.generator.compression-ratio}
    server_config: [valkey.pool.replication]
inputs:
  properties:
    value_size: {maximum: 1048576, default: 256}
    run_after_resync_s: {type: number, minimum: 0, maximum: 600, default: 1}
    min_ratio: {type: number, minimum: 0, maximum: 1000, default: 1.5, description: with compressible values; 0 disables}
components:
  - use: valkey.observer.info
    id: info
    config: {sections: [stats]}

  # Writes keep flowing over the resumed, compressed links.
  - use: valkey.action.sleep
    id: run-after-resync
    depends_on: [links-up]
    config: {seconds: {$ref: inputs.run_after_resync_s}}

  - use: valkey.oracle.repl-compression
    id: compression
    config: {min_ratio: {$ref: inputs.min_ratio}}
