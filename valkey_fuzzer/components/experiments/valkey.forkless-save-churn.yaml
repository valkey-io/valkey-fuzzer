# Forkless BGSAVE under keyspace churn that contends with the background
# serializer: RENAMEs over existing keys of the same name length, pipelined
# LRANGE/LINDEX reads of large lists whose quicklist nodes are compressed
# (list-compress-depth), and an EXEC without MULTI on a fresh connection as
# the save starts. These are the three shapes of valkey-io/valkey#4604 the
# key/value workload could not reach before. The server must reject the EXEC
# and finish the save; its RDB must reload as a consistent cut of the write
# history with every list intact, and the live data must match the ledger.
#
# A race that one save rarely hits needs many: with `auto_save` (a `save`
# setting such as "1 1") and `churn_s`, the workload runs for `churn_s`
# seconds while Valkey's own save points start a forkless save every second,
# then the save points are turned off and the captured BGSAVE runs. The
# defaults ("" and 0) run the one captured save only.
#
# Path evidence proves the forkless implementation ran under the churn: INFO
# reports a forkless save in progress, the server logs the forkless save
# start, and the stray EXEC fired and was rejected. The `forkless-completed`
# oracle requires INFO to report forkless as the last save type, rdb_saves
# to advance, and the server to log the save's completion. Standalone only:
# a cluster rejects RENAME across slots.
extends: [valkey.base, valkey.forkless, valkey.compression]
id: valkey.forkless-save-churn
deployment:
  modes: [standalone]
metadata:
  description: Forkless BGSAVE under renames, compressed-list reads, and a stray EXEC, with RDB reload and ledger oracles
  generator:
    deployment:
      replicas_per_primary: {minimum: 0, maximum: 2}
    inputs:
      # At least 600 keys per primary at 300 us each, so the observer sees the save in progress.
      stable_keys: {minimum: 2000, maximum: 6000}
      mutable_keys: {minimum: 2, maximum: 1000}
      key_save_delay_us: {minimum: 300, maximum: 2000}
      mutation_rate: {minimum: 1, maximum: 2000}
      rename_weight: {minimum: 0, maximum: 1}
      list_keys: {minimum: 1, maximum: 2}
      list_length: {minimum: 1000, maximum: 100000}
      list_read_weight: {minimum: 0, maximum: 1}
      list_read_batch: {minimum: 1, maximum: 50}
      list_compress_depth: {values: [1, 2]}
      churn_s: fixed
inputs:
  properties:
    stable_keys: {minimum: 1, default: 2000}
    mutable_keys: {minimum: 2, default: 200}
    mutation_rate: {default: 300}
    value_size: {default: 128}
    compressible: {type: boolean, default: false}
    rename_weight:
      type: number
      minimum: 0
      maximum: 100
      default: 0.2
      description: weight of RENAME src dst (two mutable keys of one name length, dst existing) beside set 0.7, del 0.1, get 0.2
    list_keys: {type: integer, minimum: 1, maximum: 100, default: 1, description: lists preloaded for the reads}
    list_length: {type: integer, minimum: 1, maximum: 10000000, default: 20000, description: elements per list (120 bytes each)}
    list_read_weight:
      type: number
      minimum: 0
      maximum: 100
      default: 0.3
      description: weight of each of LRANGE (30 elements) and LINDEX at a random index of a list
    list_read_batch: {type: integer, minimum: 1, maximum: 1000, default: 10, description: pipelined reads per list operation}
    list_compress_depth: {type: integer, minimum: 0, maximum: 65535, default: 1, description: list-compress-depth of every instance}
    auto_save: {type: string, default: "", description: "the instances' save setting during the churn period (\"1 1\": a save every second)"}
    churn_s: {type: number, minimum: 0, maximum: 3600, default: 0, description: seconds the workload runs before the captured BGSAVE}
startup_overlays:
  - overlay_id: compressed-lists
    server_config: {list-compress-depth: {$ref: inputs.list_compress_depth}}
  - overlay_id: automatic-saves
    server_config: {save: {$ref: inputs.auto_save}}
components:
  - use: valkey.capability.build-probe
    id: build
    config:
      info_fields:
        persistence: [rdb_current_bgsave_type, rdb_last_bgsave_type, forkless_estimated_seconds_remaining]

  - use: valkey.observer.info
    id: info
    config:
      instances: primaries
      sections: [persistence]
      interval_s: 0.02
      on_events: [bgsave.save-started, bgsave.save-completed]
      expectations:
        - {evidence_id: valkey.forkless.in-progress, field: rdb_current_bgsave_type, equals: forkless, when: during, instances: all, required: true}
        - {evidence_id: valkey.forkless.last-type, field: rdb_last_bgsave_type, equals: forkless, when: final, instances: all}
        - {evidence_id: valkey.persistence.saves-advanced, field: rdb_saves, delta_min: 1, instances: all}
        - {evidence_id: valkey.persistence.last-status-ok, field: rdb_last_bgsave_status, equals: ok, when: final, instances: all}
        - {evidence_id: valkey.persistence.idle-after, field: rdb_bgsave_in_progress, equals: 0, when: final, instances: all}

  - use: valkey.observer.log
    id: logs
    config:
      instances: primaries
      expect:
        - {evidence_id: valkey.forkless.log-started, pattern: "Beginning forklessSaveToDisk", instances: all, required: true}
        - {evidence_id: valkey.forkless.log-completed, pattern: "forkless-save: forkless save complete", instances: all}
      forbidden:
        - {pattern: "forkless-save: (forkless )?save failed"}
        - {pattern: "Falling back to fork-based save"}

  - use: valkey.workload.key-value
    id: writes
    config:
      compressible: {$ref: inputs.compressible}
      mix:
        set: 0.7
        del: 0.1
        get: 0.2
        rename: {$ref: inputs.rename_weight}
        lrange: {$ref: inputs.list_read_weight}
        lindex: {$ref: inputs.list_read_weight}
      list_keys: {$ref: inputs.list_keys}
      list_length: {$ref: inputs.list_length}
      list_read_batch: {$ref: inputs.list_read_batch}

  # EXEC with no MULTI on a connection of its own: an error reply, nothing else.
  - use: valkey.fault.command
    id: stray-exec
    config:
      when_event: bgsave.save-started
      instance: primaries
      command: [EXEC]
      expect_error: true

  - use: valkey.action.sleep
    id: churn
    depends_on: [writes]
    config: {seconds: {$ref: inputs.churn_s}}

  # No save point may overwrite the captured RDB before the oracle reads it.
  - use: valkey.action.command
    id: stop-automatic-saves
    depends_on: [churn]
    config: {instances: primaries, command: [CONFIG, SET, save, ""], expect: {equals: OK}}

  - use: valkey.action.bgsave
    id: bgsave
    depends_on: [writes, info, logs, stray-exec, stop-automatic-saves]
    config: {instances: primaries, expect: ok, expect_type: forkless}

  - use: valkey.oracle.rdb-snapshot
    id: snapshot
    depends_on: [bgsave]
    config: {bgsave: bgsave, workload: writes, expect_codec: {$ref: inputs.rdbcompression}}

  - use: valkey.oracle.evidence
    id: forkless-completed
    depends_on: [info, logs]
    config:
      require:
        - {evidence_id: valkey.forkless.last-type, source: info}
        - {evidence_id: valkey.persistence.saves-advanced, source: info}
        - {evidence_id: valkey.forkless.log-completed, source: logs}
required_events: [writes.seeded, bgsave.save-started, bgsave.save-completed]
required_evidence:
  - {evidence_id: valkey.fault.injected, source: stray-exec}
  - {evidence_id: valkey.rdb.reload-verified, source: snapshot}
