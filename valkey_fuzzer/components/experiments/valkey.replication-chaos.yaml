# Replication chaos on a standalone primary and its replicas, under writes:
# seeded waves of kills, restarts, graceful (FAILOVER TO) and forced
# (REPLICAOF NO ONE) promotions, repoints, stalls, backlog pressure,
# compression flips, and partitions (Linux, root, iptables, per-instance
# loopback addresses). After every wave the action heals the deployment and
# validates it with writes paused: one primary, every replica linked to it,
# equal offsets, and equal test keys.
#
# Durability matches what Valkey guarantees: a graceful promotion loses
# nothing; a forced one may lose only writes the old primary acknowledged
# after the new primary's last sync point with it, until the old primary
# stopped acknowledging (the action publishes each such window as
# valkey.data.loss-window evidence, scoped to the old primary); a write WAIT
# confirmed on every replica (inputs.wait_replicas) is never lost.
#
# Every instance starts with the rdbcompression input (valkey.compression), and
# random scenarios also draw repl-compression; the `compression` oracle checks
# that every final link, after the waves' compression flips and topology
# changes, uses the codec the final configuration negotiates.
extends: [valkey.writes, valkey.compression]
id: valkey.replication-chaos
deployment:
  modes: [standalone]
  replicas_per_primary: {minimum: 1}
metadata:
  description: Kills, promotions, repoints, stalls, and partitions of a primary and its replicas, healed and validated after every wave
  generator:
    deployment:
      mode: [standalone]
      replicas_per_primary: {minimum: 1, maximum: 4}
      base_port: {minimum: 7000, maximum: 8000}
    inputs:
      waves: {hook: valkey.generator.waves}
      wait_replicas: {hook: valkey.generator.wait-replicas}
      value_size: {values: [16, 64, 1024, 16384]}
      mutation_rate: {minimum: 50, maximum: 1000}
      stable_keys: {minimum: 0, maximum: 5000}
      validation: fixed
    server_config: [valkey.pool.compression]
inputs:
  required: [waves]
  properties:
    waves:
      type: array
      description: "waves of operations that start together: kill, restart, promote, repoint, partition, stall, backlog_pressure, compression"
    validation:
      type: object
      default: {stabilization_wait: 0, max_retries: 2, retry_delay: 1}
      description: state validation config (check_* flags, timeouts, retries), as for valkey.cluster-chaos
    wait_replicas:
      type: integer
      minimum: 0
      maximum: 16
      default: 0
      description: WAIT for this many replicas after every write (0 never waits); WAIT-confirmed writes must never be lost
components:
  - use: valkey.workload.key-value
    id: writes
    config:
      op_timeout_s: 1.0
      wait_replicas: {$ref: inputs.wait_replicas}

  - use: valkey.action.replication-chaos
    id: chaos
    depends_on: [writes]
    config:
      waves: {$ref: inputs.waves}
      validation: {$ref: inputs.validation}

  - use: valkey.oracle.deployment-state
    id: replication
    config:
      validation: {$ref: inputs.validation}
      chaos: chaos

  - use: valkey.oracle.repl-compression
    id: compression
    config: {converge_timeout_s: 60}

  - use: valkey.oracle.ledger
    id: data
    config:
      loss_window_faults: [chaos]
      # The old primary's last replies may reach the client after it was demoted.
      loss_window_after_s: 1.0
      loss_window_scope: fault_targets
      converge_timeout_s: 60
required_evidence:
  - {evidence_id: valkey.chaos.schedule, source: chaos}
  - {evidence_id: valkey.deployment.validated, source: replication}
