# A replica runs a forkless BGSAVE while its primary keeps writing to it, and
# the primary then forces a full sync mid-save (DEBUG CHANGE-REPL-ID, then
# the replica links are dropped), which the replica loads the way
# `diskless_load` says. The replica must survive both (valkey-io/valkey#4604:
# a replicated write to a key the save holds, and a swapdb load that frees
# the kvstore the save iterates), the full sync must complete, and the
# replica must converge on the write ledger.
#
# Path evidence: INFO reports a forkless save in progress on every replica,
# the replicas log the save start, both faults fired, and the `full-sync`
# oracle requires the primary to count a full sync and the replicas to log
# its completion. A replicated write blocks on a key the save holds only
# when the key's existing value is over 512 bytes (`value_size`), and the
# swapdb path runs only with `diskless_load: swapdb`; random scenarios keep
# both at their defaults, and the bug zoo's cases set them.
extends: [valkey.base, valkey.forkless, valkey.compression]
id: valkey.forkless-save-on-replica
deployment:
  modes: [standalone]
  replicas_per_primary: {minimum: 1}
metadata:
  description: A replica's forkless BGSAVE under replicated writes, with a full sync forced mid-save
  generator:
    deployment:
      replicas_per_primary: {minimum: 1, maximum: 2}
    inputs:
      # At least 2000 keys at 200 us each: the links drop while the save is still scanning.
      stable_keys: {minimum: 2000, maximum: 20000}
      key_save_delay_us: {minimum: 200, maximum: 1000}
      mutation_rate: {minimum: 1, maximum: 1000}
      value_size: fixed
      diskless_load: fixed
      sync_delay_s: {minimum: 0, maximum: 0.3}
inputs:
  properties:
    stable_keys: {minimum: 1, default: 5000}
    key_save_delay_us: {minimum: 100}
    value_size: {default: 64}
    diskless_load:
      type: string
      enum: [disabled, on-empty-db, swapdb, flush-before-load]
      default: disabled
      description: the replicas' repl-diskless-load
    sync_delay_s:
      type: number
      minimum: 0
      maximum: 30
      default: 0.2
      description: seconds after the replicas' save starts before the primary changes its replication ID and drops their links
startup_overlays:
  - overlay_id: forced-full-sync
    server_config:
      enable-debug-command: "yes"
      repl-diskless-sync: "yes"
      repl-diskless-sync-delay: 0
      repl-diskless-load: {$ref: inputs.diskless_load}
components:
  - use: valkey.observer.info
    id: info
    config:
      instances: replicas
      sections: [persistence]
      interval_s: 0.02
      on_events: [bgsave.save-started]
      expectations:
        - {evidence_id: valkey.forkless.in-progress, field: rdb_current_bgsave_type, equals: forkless, when: during, instances: all, required: true}

  - use: valkey.observer.info
    id: primary-info
    config:
      instances: primaries
      sections: [stats]
      interval_s: 0.1
      expectations:
        - {evidence_id: valkey.replication.full-resync-counted, field: sync_full, delta_min: 1}

  - use: valkey.observer.log
    id: logs
    config:
      instances: replicas
      expect:
        - {evidence_id: valkey.forkless.log-started, pattern: "Beginning forklessSaveToDisk", instances: all, required: true}
        - {evidence_id: valkey.replication.full-sync-completed-logged, pattern: "sync: Finished with success", instances: all}

  # Only the replicas' save is slowed: the full sync streams at full speed, so a
  # replica swaps in the primary's data while its own save is still scanning.
  - use: valkey.action.command
    id: fast-primary-save
    depends_on: [writes]
    config: {instances: primaries, command: [CONFIG, SET, rdb-key-save-delay, 0], expect: {equals: OK}}

  # A new replication ID refuses every replica's PSYNC: the next sync is full.
  - use: valkey.fault.command
    id: change-replid
    config:
      when_event: bgsave.save-started
      instance: primaries
      command: [DEBUG, CHANGE-REPL-ID]
      delay_s: {$ref: inputs.sync_delay_s}

  - use: valkey.fault.command
    id: drop-replica-links
    config:
      when_event: change-replid.injected
      instance: primaries
      command: [CLIENT, KILL, TYPE, replica]

  # The full sync may cancel the save or let it finish: either is fine, the replica's survival is the point.
  - use: valkey.action.bgsave
    id: bgsave
    depends_on: [writes, info, primary-info, logs, change-replid, drop-replica-links, fast-primary-save]
    config: {instances: replicas, expect: any, capture_rdb: false}

  - use: valkey.action.poll
    id: links-up
    depends_on: [bgsave]
    config:
      instances: replicas
      section: replication
      field: master_link_status
      predicate: {equals: up}
      timeout_s: 120

  - use: valkey.oracle.ledger
    id: data
    config: {converge_timeout_s: 120}

  - use: valkey.oracle.deployment-state
    id: deployment-state
    config: {validation: {stabilization_wait: 2, validation_timeout: 120}}

  - use: valkey.oracle.evidence
    id: full-sync
    depends_on: [primary-info, logs]
    config:
      require:
        - {evidence_id: valkey.replication.full-resync-counted, source: primary-info}
        - {evidence_id: valkey.replication.full-sync-completed-logged, source: logs}
required_events: [writes.seeded, bgsave.save-started, links-up.completed]
required_evidence:
  - {evidence_id: valkey.fault.injected, source: change-replid}
  - {evidence_id: valkey.fault.injected, source: drop-replica-links}
