# Replication compression across builds: primaries run a build with
# repl-compression and rdbcompression, replicas an older build without them
# (deployment.instance_binaries.replica, also named as the `old_binary`
# input). A failover of `failover_shard` then promotes an old replica, so
# that shard replicates from an old primary to a newer replica, and every
# primary drops its replicas after changing its replication ID, forcing full
# syncs in both directions.
#
# Every link must stay plaintext: an old replica advertises no codec, and an
# old primary ignores the newer replica's. A newer primary must serve an old
# replica a diskless full sync (its older RDB version, and a codec other than
# a whole-stream rdbcompression, rule out the file on disk), and a newer
# replica loading from disk rewrites the RDB into its own rdbcompression. The
# `old-build` probe proves the old binary lacks repl-compression; an old
# binary that has it, or two copies of one build, is a setup error (ERROR).
extends: [valkey.full-sync, valkey.compression, valkey.history]
id: valkey.repl-compression-mixed-version
deployment:
  modes: [cluster]
  replicas_per_primary: {minimum: 1}
metadata:
  description: Plaintext links and forced diskless full syncs between compression-capable and older builds
  generator:
    # Runs only with two builds: name the replicas' older build with --base
    # (deployment.instance_binaries.replica and the old_binary input); with one
    # build the run is ERROR.
    hook: valkey.generator.old-build
    deployment:
      cluster: {replicas_per_primary: {minimum: 1, maximum: 2}}
    inputs:
      failover_shard: {values: [0, 1, 2]}
      run_before_sync_s: {minimum: 0.5, maximum: 2}
inputs:
  required: [old_binary]
  properties:
    old_binary:
      type: environment_reference
      reference_kinds: [artifacts]
      description: "The replicas' older build, e.g. {$ref: artifacts.old.binary}"
    rdbcompression: {default: lz4}
    primary_repl_compression: {type: string, enum: ["no", "yes", lz4, zstd], default: lz4}
    failover_shard: {type: integer, minimum: 0, maximum: 15, default: 0}
startup_overlays:
  # The old build rejects these options, so only the (newer) primaries get them.
  - overlay_id: rdb-compression
    selector: primaries
  - overlay_id: primary-repl-compression
    selector: primaries
    server_config:
      repl-compression: {$ref: inputs.primary_repl_compression}
components:
  - use: valkey.capability.build-probe
    id: build
    config: {min_distinct_builds: 2}

  - use: valkey.capability.build-probe
    id: old-build
    config:
      scope: listed
      binaries: [{$ref: inputs.old_binary}]
      lacks_configs: [repl-compression]

  - use: valkey.action.failover
    id: failover
    depends_on: [writes]
    config: {shard: {$ref: inputs.failover_shard}}

  - use: valkey.action.sleep
    id: run-before-sync
    depends_on: [failover]

  - use: valkey.oracle.repl-compression
    id: compression
    config: {full_sync: true, expect_algo: none, converge_timeout_s: 60}

  - use: valkey.oracle.binary-check
    id: provenance
    config: {min_distinct_builds: 2}

  - use: valkey.oracle.deployment-state
    id: deployment-state
    config: {validation: {stabilization_wait: 2, validation_timeout: 120}}
required_events: [failover.completed]
required_evidence:
  - {evidence_id: valkey.capability.supported, source: old-build}
  - {evidence_id: valkey.failover.result, source: failover}
  - {evidence_id: valkey.repl.compression-verified, source: compression}
  - {evidence_id: valkey.binary.verified, source: provenance}
