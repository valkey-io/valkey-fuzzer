# Change repl-compression at runtime under writes: the primaries' ceiling,
# then the replicas' advertised codec, then the primaries' again. A live link
# cannot switch codecs mid-stream, so each change that alters a link's
# negotiated codec disconnects it (the primary logs "Disconnecting replica R
# to renegotiate replication compression", the replica "Disconnecting from
# primary to renegotiate ...") and the reconnect resumes with PSYNC, never a
# full sync. Both kinds of renegotiation are required, so the changes must
# include one that alters what a primary sends and one that alters what a
# compressed link's replica advertises (a replica on a plaintext stream that
# stops advertising does not reconnect). The defaults (lz4/zstd, then zstd,
# lz4, no) change the codec at every step. Both renegotiation log lines are
# path evidence; the `psync` oracle requires sync_partial_ok to advance with no
# new full sync. The `compression` oracle checks the final links against the
# final configuration, and no acknowledged write may be lost.
extends: [valkey.base, valkey.repl-compression]
id: valkey.repl-compression-runtime-change
deployment:
  modes: [standalone, cluster]
  replicas_per_primary: {minimum: 1}
metadata:
  description: Runtime repl-compression changes renegotiate links with partial resyncs and no lost writes
  generator:
    # Draws the three changes so that a primary and a replica both renegotiate.
    hook: valkey.generator.repl-compression-changes
    inputs:
      # A primary renegotiates one link per second: every link converges before the next change.
      change_interval_s: {minimum: 3, maximum: 5}
inputs:
  properties:
    stable_keys: {default: 500}
    mutable_keys: {default: 300}
    mutation_rate: {minimum: 1, default: 400}
    replica_repl_compression: {default: zstd}
    primary_change_1: {type: string, enum: ["no", "yes", lz4, zstd], default: zstd}
    replica_change: {type: string, enum: ["no", "yes", lz4, zstd], default: lz4}
    primary_change_2: {type: string, enum: ["no", "yes", lz4, zstd], default: "no"}
    change_interval_s: {type: number, minimum: 0, maximum: 600, default: 2}
components:
  - use: valkey.capability.build-probe
    id: build
    config:
      config_set:
        repl-compression:
          - {$ref: inputs.primary_change_1}
          - {$ref: inputs.replica_change}
          - {$ref: inputs.primary_change_2}

  - use: valkey.observer.info
    id: info
    config:
      instances: primaries
      sections: [stats, replication]
      interval_s: 0.2
      expectations:
        - {evidence_id: valkey.replication.partial-resync-counted, field: sync_partial_ok, delta_min: 1}
        - {evidence_id: valkey.replication.no-full-resync, field: sync_full, delta_max: 0, instances: all}
        # Diagnostic: the links' codec between the changes (the oracle sees only the last).
        - {evidence_id: valkey.repl.links-zstd-observed, field: slave*.repl_compression, equals: zstd, when: during}
        - {evidence_id: valkey.repl.links-lz4-observed, field: slave*.repl_compression, equals: lz4, when: during}

  - use: valkey.observer.log
    id: logs
    config:
      instances: all
      expect:
        - {evidence_id: valkey.repl.renegotiated-by-primary, pattern: "Disconnecting replica .* to renegotiate replication compression", required: true}
        - {evidence_id: valkey.repl.renegotiated-by-replica, pattern: "Disconnecting from primary to renegotiate replication compression", required: true}
      forbidden:
        - {pattern: "Full resync from primary"}

  - use: valkey.action.sleep
    id: run-before-change-1
    depends_on: [writes, info, logs]
    config: {seconds: {$ref: inputs.change_interval_s}}

  - use: valkey.action.command
    id: change-1
    depends_on: [run-before-change-1]
    config: {instances: primaries, command: [CONFIG, SET, repl-compression, {$ref: inputs.primary_change_1}], expect: {equals: OK}}

  - use: valkey.action.sleep
    id: run-before-change-2
    depends_on: [change-1]
    config: {seconds: {$ref: inputs.change_interval_s}}

  - use: valkey.action.command
    id: change-2
    depends_on: [run-before-change-2]
    config: {instances: replicas, command: [CONFIG, SET, repl-compression, {$ref: inputs.replica_change}], expect: {equals: OK}}

  - use: valkey.action.sleep
    id: run-before-change-3
    depends_on: [change-2]
    config: {seconds: {$ref: inputs.change_interval_s}}

  - use: valkey.action.command
    id: change-3
    depends_on: [run-before-change-3]
    config: {instances: primaries, command: [CONFIG, SET, repl-compression, {$ref: inputs.primary_change_2}], expect: {equals: OK}}

  - use: valkey.action.sleep
    id: run-after-changes
    depends_on: [change-3]
    config: {seconds: {$ref: inputs.change_interval_s}}

  - use: valkey.oracle.ledger
    id: data
    config: {converge_timeout_s: 60}

  - use: valkey.oracle.deployment-state
    id: deployment-state
    config: {validation: {stabilization_wait: 1}}

  - use: valkey.oracle.evidence
    id: psync
    depends_on: [info]
    config:
      require:
        - {evidence_id: valkey.replication.partial-resync-counted, source: info}
        - {evidence_id: valkey.replication.no-full-resync, source: info}
required_events: [change-3.completed]
