# Drop every replica link from the primary side (CLIENT KILL TYPE replica)
# under continuous writes and require a partial resynchronization: the primary
# counts sync_partial_ok without any new full sync, both sides log the PSYNC
# handshake, and every replica converges byte-for-byte with its primary (the
# valkey.psync procedure).
extends: [valkey.psync]
id: valkey.replication-partial-resync
metadata:
  description: Disconnect replicas mid-stream and verify PSYNC partial resync and convergence
  generator:
    inputs:
      # At most about 2 MB of writes per second, well inside the default 10 MB
      # backlog, so the reconnect is always a partial resync.
      mutation_rate: {minimum: 1, maximum: 2000}
      value_size: {values: [1, 64, 256, 1024]}
    server_config: [valkey.pool.replication, valkey.pool.compression]
components:
  # Probe each binary with the configuration the deployment gives it: a codec
  # the build lacks (zstd without BUILD_ZSTD=yes) makes the run SKIP_UNSUPPORTED.
  - use: valkey.capability.build-probe
    id: build
    config: {deployment_config: [rdbcompression, repl-compression]}

  - use: valkey.observer.info
    id: info
    config: {sections: [stats, replication]}

  - use: valkey.action.sleep
    id: settle
    depends_on: [drop-replica-links]
    config: {seconds: 0.5}

  - use: valkey.action.poll
    id: links-up
    depends_on: [settle]
