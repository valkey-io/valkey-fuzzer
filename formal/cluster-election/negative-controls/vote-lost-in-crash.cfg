\* best-effort: a vote leaves while its save is queued, and the voter
\* crashes before the background writer saves it.
CONSTANTS
    Primaries = {p1, p2, p3}
    Candidates = {r1, r2}
    MaxEpoch = 2
    MaxCrashes = 1
    PersistBeforeAck = FALSE
    FlushBeforeSave = FALSE

SPECIFICATION Spec
INVARIANT NoVoteLostInCrash
