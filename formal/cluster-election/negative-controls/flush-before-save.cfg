\* nodes.conf saved synchronously (cluster-config-save-behavior sync), but a
\* queued vote may leave before that save: the link's write handler was already
\* armed in the same event-loop iteration, or a QoS poll flushed it.
CONSTANTS
    Primaries = {p1, p2, p3}
    Candidates = {r1, r2}
    MaxEpoch = 2
    MaxCrashes = 1
    PersistBeforeAck = TRUE
    FlushBeforeSave = TRUE

SPECIFICATION Spec
INVARIANT OneWinnerPerEpoch
