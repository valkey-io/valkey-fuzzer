\* As vote-before-save.cfg: the save is only queued for the background writer
\* when the vote leaves (best-effort), so a crash loses the vote and the
\* restarted primary votes again in the same epoch.
CONSTANTS
    Primaries = {p1, p2, p3}
    Candidates = {r1, r2}
    MaxEpoch = 2
    MaxCrashes = 1
    PersistBeforeAck = FALSE
    FlushBeforeSave = FALSE

SPECIFICATION Spec
INVARIANT VoteOncePerEpoch
