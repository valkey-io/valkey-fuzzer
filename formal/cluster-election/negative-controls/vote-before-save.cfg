\* The save is queued for the BIO thread before the vote leaves, but may land
\* after it (cluster-config-save-behavior best-effort, background save).
CONSTANTS
    Primaries = {p1, p2, p3}
    Candidates = {r1, r2}
    MaxEpoch = 2
    MaxCrashes = 1
    PersistBeforeAck = FALSE
    FlushBeforeSave = FALSE

SPECIFICATION Spec
INVARIANT OneWinnerPerEpoch
