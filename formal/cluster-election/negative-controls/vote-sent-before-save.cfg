\* best-effort: a vote leaves while its save is still queued for the
\* background writer, so nodes.conf does not hold it yet.
CONSTANTS
    Primaries = {p1, p2, p3}
    Candidates = {r1, r2}
    MaxEpoch = 2
    MaxCrashes = 1
    PersistBeforeAck = FALSE
    FlushBeforeSave = FALSE

SPECIFICATION Spec
INVARIANT VotesSavedBeforeSent
