\* nodes.conf saved before the vote leaves: cluster-config-save-behavior sync,
\* and no vote written before that save (FlushBeforeSave = FALSE).
CONSTANTS
    Primaries = {p1, p2, p3}
    Candidates = {r1, r2}
    MaxEpoch = 2
    MaxCrashes = 1
    PersistBeforeAck = TRUE
    FlushBeforeSave = FALSE

SPECIFICATION Spec
INVARIANTS TypeOK OneWinnerPerEpoch VoteOncePerEpoch VotesSavedBeforeSent NoVoteLostInCrash
