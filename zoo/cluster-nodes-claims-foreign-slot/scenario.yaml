scenario_id: zoo-cluster-nodes-claims-foreign-slot
seed: 1309
experiment:
  id: valkey.cluster-chaos
  inputs:
    waves:
      - [{op: failover, shard: 0, timeout_s: 30}]
    validation:
      stabilization_wait: 5.0
      validation_timeout: 30.0
      cluster_status_config: {acceptable_states: [ok, unknown]}
      replication_config: {max_acceptable_lag: 15.0}
