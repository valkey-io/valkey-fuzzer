name: Search Abort Probes

# A one-off audit run (dispatch only, not scheduled): valkey-search query, aggregate, and hybrid shapes that a
# code reading judged most likely to trip one of the module's CHECK/LOG(FATAL) aborts, each sent to a standalone
# server that is then pinged. The probes are .github/scripts/search_abort_probes.py; every probe that kills the
# server is re-run skipped so the rest still run, and the job fails if any aborted. The script's header names the
# audited valkey-search commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The module's allocations live to shutdown, so leaks are not judged; a real abort is a CHECK, not a leak.
      ASAN_OPTIONS: allocator_may_return_null=1:quarantine_size_mb=16:detect_leaks=0
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install the build tools and valkey-search's dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q build-essential clang cmake ninja-build pkg-config libssl-dev libzstd-dev
          curl -fsSL -o /tmp/deps.deb \
            https://github.com/valkey-io/valkey-search/releases/download/1.0.0-rc1/valkey-search-deps-ubuntu-noble-amd64.deb
          sudo dpkg -i /tmp/deps.deb

      - name: Build Valkey unstable with ASan
        run: |
          git clone --depth 1 https://github.com/valkey-io/valkey.git /tmp/valkey
          make -C /tmp/valkey -j"$(nproc)" BUILD_ZSTD=yes CC=clang OPT=-O1 SANITIZER=address

      - name: Build valkey-search main
        run: |
          git clone --depth 1 https://github.com/valkey-io/valkey-search.git /tmp/valkey-search
          cd /tmp/valkey-search && ./build.sh
          git -C /tmp/valkey-search rev-parse HEAD

      - name: Install redis-py
        run: python -m pip install --upgrade pip redis

      - name: Run the probes
        run: |
          set -u
          /tmp/valkey/src/valkey-server --port 6399 --daemonize no \
            --loadmodule /tmp/valkey-search/.build-release/libsearch.so \
            --enable-debug-command yes --save '' --logfile /tmp/server.log &
          for _ in $(seq 30); do
            /tmp/valkey/src/valkey-cli -p 6399 ping 2>/dev/null | grep -q PONG && break; sleep 1
          done
          # A probe that aborts the server exits 3; restart and skip every probe that has aborted so far, so the
          # rest still run. At most 36 restarts (one per probe), then give up.
          skip=""
          aborted=""
          for _ in $(seq 36); do
            args="6399"
            [ -n "$skip" ] && args="$args --skip $skip"
            if python .github/scripts/search_abort_probes.py $args | tee -a /tmp/probes.log; then
              break
            fi
            name=$(grep '^ABORT ' /tmp/probes.log | tail -1 | awk '{print $2}')
            [ -z "$name" ] && break
            aborted="$aborted $name"
            skip="${skip:+$skip,}$name"
            echo "::warning::probe ${name} aborted the server; restarting without it"
            /tmp/valkey/src/valkey-server --port 6399 --daemonize no \
              --loadmodule /tmp/valkey-search/.build-release/libsearch.so \
              --enable-debug-command yes --save '' --logfile /tmp/server.log &
            for _ in $(seq 30); do
              /tmp/valkey/src/valkey-cli -p 6399 ping 2>/dev/null | grep -q PONG && break; sleep 1
            done
          done
          echo "aborted probes:${aborted:- none}"
          if [ -n "$aborted" ]; then
            echo "::error::these probes aborted the server:${aborted}"
            exit 1
          fi

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: search-abort-probes-${{ github.run_id }}
          path: |
            /tmp/server.log
            /tmp/probes.log
          if-no-files-found: warn
          retention-days: 30
