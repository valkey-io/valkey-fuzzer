name: Valkey Fuzzer PR Batch

# Runs given scenarios (valkey-ci-agent's AI proposals and spec-translated
# scenarios for a pull request) against one Valkey commit, through the batch
# runner with the candidate profile, and uploads the batch folder. The
# scenarios arrive as a JSON object mapping a name to scenario YAML; they run
# as written, on the build of valkey_sha (a full, lowercase 40-hex SHA).
# With valkey_parent_sha, a second commit is built the same way and every
# scenario gets an artifacts.parent declaration of it, so a scenario can
# compare the two builds ({$ref: artifacts.parent.binary}); build chooses a
# plain or a sanitizer build for both.
# With module_repository, a module is built at module_sha (and at
# module_parent_sha, the same way) against the Valkey build under test, and
# every scenario gets artifacts.module (and artifacts.module_parent) of it, a
# valkey.artifact.local-module to load ({$ref: artifacts.module.path}); a
# module change then needs no valkey_parent_sha: one Valkey build, two module
# builds. The batch knows how to build the modules in the "Build the modules"
# step's table, by repository name: valkey-json, and valkey, whose
# tests/modules it builds at both commits (module_file names the one).
# Scenarios translated from a spec bundle that brings its own data-only
# experiments come with the bundle in spec_bundles: the batch finds the bundle
# through VALKEY_FUZZER_SPEC_PATH and loads its experiments/ with --experiment-dir.
# A proposal's own experiments (data-only, their IDs under proposed.) come in
# experiments, loaded the same way; the batch folder keeps a copy at experiments/.
# With random_seeds, the batch also draws that many seeds of every experiment
# that needs one build, but those in exclude_experiments, so the given
# scenarios run beside a random baseline.
# The batch runs as root, so the tmpfs and iptables experiments run too.
# The upload leaves out the write ledgers of the runs that passed, which only
# the data oracle reads and which can make the folder too large to triage.

run-name: Valkey Fuzzer PR Batch ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: 'JSON object mapping a scenario name to its YAML (at most 60,000 characters)'
        required: true
        type: string
      spec_bundles:
        description: >-
          JSON object mapping a spec bundle name to {path in the bundle: file text}, for bundles the
          scenarios need (claims.yaml, model.tla, mapping.yaml, *.cfg, negative-controls/, experiments/;
          at most 60,000 characters)
        required: false
        type: string
        default: ""
      experiments:
        description: >-
          JSON object mapping an experiment file name (<name>.yaml) to its YAML, data-only experiments whose
          id starts with proposed., loaded with --experiment-dir (at most 20,000 characters)
        required: false
        type: string
        default: ""
      valkey_repository:
        description: Repository holding the Valkey commit to test
        required: false
        type: string
        default: valkey-io/valkey
      valkey_ref:
        description: The ref the commit came from (for example refs/pull/123/head); recorded in the summary
        required: false
        type: string
        default: ""
      valkey_sha:
        description: Full SHA of the Valkey commit to build and test (40 lowercase hex characters)
        required: true
        type: string
      valkey_parent_sha:
        description: >-
          Full SHA of a second commit (the change's parent) to build the same way and declare to every
          scenario as artifacts.parent; empty for none
        required: false
        type: string
        default: ""
      build:
        description: How every commit is built
        required: false
        type: choice
        options:
          - default
          - asan
          - ubsan
        default: default
      module_repository:
        description: >-
          Repository of a module to build at module_sha against the Valkey build and declare to every scenario as
          artifacts.module: valkey-json, or valkey for its tests/modules (a fork builds as its upstream); empty for
          none
        required: false
        type: string
        default: ""
      module_sha:
        description: Full SHA of the module commit to build (40 lowercase hex characters); needs module_repository
        required: false
        type: string
        default: ""
      module_parent_sha:
        description: >-
          Full SHA of a second module commit (the change's parent), built the same way and declared as
          artifacts.module_parent; empty for none
        required: false
        type: string
        default: ""
      module_file:
        description: >-
          The built module to declare, relative to its checkout; empty for the module's own (valkey-json:
          build/src/libjson.so); valkey's tests/modules needs one, such as tests/modules/datatype.so
        required: false
        type: string
        default: ""
      random_seeds:
        description: Random seeds of each one-build experiment to run beside the scenarios, 0 to 4
        required: false
        type: string
        default: "0"
      request_id:
        description: A name for this run, shown in its title, so the caller that dispatched it can find it
        required: false
        type: string
        default: ""
      exclude_experiments:
        description: Experiment IDs, separated by spaces, that the random baseline leaves out
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CANDIDATES_DIR: /tmp/fuzzer-pr-batch/candidates
      # The spec bundles, one directory each: the batch looks them up here by name.
      SPEC_DIR: /tmp/fuzzer-pr-batch/spec
      # The experiments input's documents; written only when there are any.
      EXPERIMENTS_DIR: /tmp/fuzzer-pr-batch/experiments
      # The uploaded batch folder: summary.json lists every run and runs[].report its run report.
      BATCH_DIR: /tmp/fuzzer-pr-batch/batch
      # The parent commit's build, which check-inputs declares to every scenario as artifacts.parent.
      PARENT_BINARY: ${{ github.workspace }}/valkey-parent/src/valkey-server
      # The module checkouts, whose builds check-inputs declares as artifacts.module and artifacts.module_parent.
      MODULE_DIR: ${{ github.workspace }}/module-src
      MODULE_PARENT_DIR: ${{ github.workspace }}/module-parent
    steps:
      - name: Checkout valkey-fuzzer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install valkey-fuzzer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # Inputs reach the scripts only through the environment, never the shell.
      - name: Check the inputs and write the scenarios and bundles
        env:
          INPUT_SCENARIOS: ${{ inputs.scenarios }}
          INPUT_SPEC_BUNDLES: ${{ inputs.spec_bundles }}
          INPUT_EXPERIMENTS: ${{ inputs.experiments }}
          INPUT_VALKEY_REPOSITORY: ${{ inputs.valkey_repository }}
          INPUT_VALKEY_SHA: ${{ inputs.valkey_sha }}
          INPUT_VALKEY_PARENT_SHA: ${{ inputs.valkey_parent_sha }}
          INPUT_BUILD: ${{ inputs.build }}
          INPUT_MODULE_REPOSITORY: ${{ inputs.module_repository }}
          INPUT_MODULE_SHA: ${{ inputs.module_sha }}
          INPUT_MODULE_PARENT_SHA: ${{ inputs.module_parent_sha }}
          INPUT_MODULE_FILE: ${{ inputs.module_file }}
          INPUT_RANDOM_SEEDS: ${{ inputs.random_seeds }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
          INPUT_EXCLUDE_EXPERIMENTS: ${{ inputs.exclude_experiments }}
        run: python .github/scripts/ci.py check-inputs

      - name: Checkout Valkey
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.valkey_repository }}
          ref: ${{ inputs.valkey_sha }}
          fetch-depth: 1
          path: valkey-src
          persist-credentials: false

      - name: Checkout the parent commit
        if: inputs.valkey_parent_sha != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.valkey_repository }}
          ref: ${{ inputs.valkey_parent_sha }}
          fetch-depth: 1
          path: valkey-parent
          persist-credentials: false

      # Both commits get the build the input names: the sanitizer lines are Valkey's own CI's.
      - name: Build Valkey
        env:
          INPUT_VALKEY_SHA: ${{ inputs.valkey_sha }}
          INPUT_VALKEY_PARENT_SHA: ${{ inputs.valkey_parent_sha }}
          INPUT_BUILD: ${{ inputs.build }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang pkg-config libssl-dev libzstd-dev tcl
          build() {
            test "$(git -C "$1" rev-parse HEAD)" = "$2"
            case "${INPUT_BUILD}" in
              default) make -C "$1" -j"$(nproc)" BUILD_ZSTD=yes ;;
              asan) make -C "$1" -j"$(nproc)" BUILD_ZSTD=yes CC=clang OPT=-O3 SANITIZER=address ;;
              ubsan) make -C "$1" -j"$(nproc)" BUILD_ZSTD=yes CC=clang OPT=-O3 SANITIZER=undefined LUA_DEBUG=yes ;;
              *) echo "build must be default, asan, or ubsan, not '${INPUT_BUILD}'" >&2; exit 1 ;;
            esac
            "$1/src/valkey-server" --version
          }
          build valkey-src "${INPUT_VALKEY_SHA}"
          if [ -n "${INPUT_VALKEY_PARENT_SHA}" ]; then
            build valkey-parent "${INPUT_VALKEY_PARENT_SHA}"
          fi

      - name: Checkout the module
        if: inputs.module_repository != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.module_repository }}
          ref: ${{ inputs.module_sha }}
          fetch-depth: 1
          path: module-src
          persist-credentials: false

      - name: Checkout the module's parent commit
        if: inputs.module_parent_sha != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.module_repository }}
          ref: ${{ inputs.module_parent_sha }}
          fetch-depth: 1
          path: module-parent
          persist-credentials: false

      # The modules the batch builds, by repository name, both commits the same way; ci.py's MODULE_FILES names
      # the file each leaves. valkey-json builds against the Valkey build under test (its valkeymodule.h, so its
      # build clones no Valkey); valkey's tests/modules against its own commit's header.
      - name: Build the modules
        if: inputs.module_repository != ''
        env:
          INPUT_MODULE_REPOSITORY: ${{ inputs.module_repository }}
          INPUT_MODULE_SHA: ${{ inputs.module_sha }}
          INPUT_MODULE_PARENT_SHA: ${{ inputs.module_parent_sha }}
        run: |
          build_module() {
            test "$(git -C "$1" rev-parse HEAD)" = "$2"
            case "${INPUT_MODULE_REPOSITORY#*/}" in
              valkey-json)
                command -v cmake > /dev/null || sudo apt-get install -y cmake
                (cd "$1" && SERVER_VERSION=unstable VALKEY_MODULE_H_PATH="${GITHUB_WORKSPACE}/valkey-src/src/valkeymodule.h" ./build.sh) ;;
              valkey) make -C "$1/tests/modules" -j"$(nproc)" ;;
              *) echo "no module build for '${INPUT_MODULE_REPOSITORY}'" >&2; exit 1 ;;
            esac
          }
          build_module module-src "${INPUT_MODULE_SHA}"
          if [ -n "${INPUT_MODULE_PARENT_SHA}" ]; then
            build_module module-parent "${INPUT_MODULE_PARENT_SHA}"
          fi

      - name: Run the scenarios through batch
        id: batch
        continue-on-error: true
        env:
          VALKEY_FUZZER_SPEC_PATH: ${{ env.SPEC_DIR }}
          RANDOM_SEEDS: ${{ inputs.random_seeds }}
          INPUT_VALKEY_SHA: ${{ inputs.valkey_sha }}
          # Checked by check-inputs: experiment IDs separated by spaces.
          EXCLUDE_EXPERIMENTS: ${{ inputs.exclude_experiments }}
          # What Valkey's own test harness sets for every server it starts (tests/support/server.tcl): a test
          # that expects an allocation to fail must see NULL, not an address sanitizer error. Harmless elsewhere.
          ASAN_OPTIONS: allocator_may_return_null=1
        run: |
          # Each bundle's own data-only experiments, for the scenarios translated from it.
          experiment_dirs=()
          for directory in "${SPEC_DIR}"/*/experiments; do
            if [ -d "${directory}" ]; then
              experiment_dirs+=(--experiment-dir "${directory}")
            fi
          done
          # The proposal's own experiments.
          if [ -d "${EXPERIMENTS_DIR}" ]; then
            experiment_dirs+=(--experiment-dir "${EXPERIMENTS_DIR}")
          fi
          # The random baseline: seeds from the commit, so a rerun of this commit draws the same scenarios.
          # The experiments that need a second build are left out: this batch has one.
          random=()
          if [ "${RANDOM_SEEDS}" != "0" ]; then
            random=(--random all --seeds "${RANDOM_SEEDS}" --first-seed "$((16#${INPUT_VALKEY_SHA:0:7}))"
              --exclude experiment=valkey.rolling-upgrade --exclude experiment=valkey.mixed-version-cluster
              --exclude experiment=valkey.repl-compression-mixed-version)
            for experiment in ${EXCLUDE_EXPERIMENTS}; do
              random+=(--exclude "experiment=${experiment}")
            done
          fi
          # The folder exists even when the batch exits before writing it, so the chown and the upload do not fail.
          mkdir -p "${BATCH_DIR}"
          status=0
          sudo -E env "PATH=${PATH}" valkey-fuzzer batch --scenarios "${CANDIDATES_DIR}" "${random[@]}" \
            --profile candidate --workers 2 \
            --valkey-binary "${GITHUB_WORKSPACE}/valkey-src/src/valkey-server" --batch-id fuzzer-pr-batch \
            --out "${BATCH_DIR}" "${experiment_dirs[@]}" || status=$?
          # Root wrote the folder: give it back, so the summary and the upload can read it.
          sudo chown -R "$(id -u):$(id -g)" "${BATCH_DIR}"
          # The passing runs' write ledgers would make the folder too large to triage.
          python .github/scripts/ci.py drop-ledgers
          exit "${status}"

      - name: Summarize the batch
        if: always()
        env:
          SUMMARY_TITLE: Valkey Fuzzer PR Batch
          VALKEY_REPOSITORY: ${{ inputs.valkey_repository }}
          VALKEY_REF: ${{ inputs.valkey_ref }}
          VALKEY_SHA: ${{ inputs.valkey_sha }}
          VALKEY_PARENT_SHA: ${{ inputs.valkey_parent_sha }}
          BUILD: ${{ inputs.build }}
          MODULE_REPOSITORY: ${{ inputs.module_repository }}
          MODULE_SHA: ${{ inputs.module_sha }}
          MODULE_PARENT_SHA: ${{ inputs.module_parent_sha }}
        run: python .github/scripts/ci.py summary

      - name: Upload the batch folder
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzzer-batch-${{ github.run_id }}
          path: ${{ env.BATCH_DIR }}
          if-no-files-found: warn
          retention-days: 30

      - name: Fail when the batch did not pass
        if: steps.batch.outcome != 'success'
        run: exit 1
