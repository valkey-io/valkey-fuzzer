name: Valkey Cluster PR Fuzzer

on:
  workflow_call:
    inputs:
      fuzzer_repository:
        description: Repository containing the fuzzer workflow and code to check out when called from another repo
        required: false
        type: string
        default: ""
      fuzzer_ref:
        description: Branch, tag, or commit SHA of the fuzzer repo to check out when called from another repo
        required: false
        type: string
        default: ""
      valkey_repository:
        description: Repository containing the Valkey PR to test
        required: false
        type: string
        default: valkey-io/valkey
      valkey_ref:
        description: Ref to build and test, for example refs/pull/123/merge
        required: true
        type: string
      pr_number:
        description: Pull request number, used only for summaries
        required: false
        type: string
        default: ""
      pr_url:
        description: Pull request URL, used only for summaries
        required: false
        type: string
        default: ""
      label_name:
        description: Trigger label, used only for summaries
        required: false
        type: string
        default: run-cluster-fuzzer
      run_count:
        description: Number of random fuzzer runs to queue, from 1 to 256
        required: false
        type: number
        default: 10
  workflow_dispatch:
    inputs:
      pr_link:
        description: "GitHub PR URL (e.g. https://github.com/valkey-io/valkey/pull/123). Fills in repository, ref, pr_number, and pr_url automatically."
        required: false
        type: string
        default: ""
      fuzzer_repository:
        description: "Advanced: alternate fuzzer repository to check out for manual testing. Defaults to the current repository/commit."
        required: false
        type: string
        default: ""
      fuzzer_ref:
        description: "Advanced: alternate fuzzer branch, tag, or commit SHA to check out for manual testing. Defaults to the current commit."
        required: false
        type: string
        default: ""
      valkey_repository:
        description: "Repository containing the Valkey commit to test when not using pr_link"
        required: false
        type: string
        default: ""
      valkey_ref:
        description: "Ref to build and test when not using pr_link (e.g. refs/pull/123/merge)"
        required: false
        type: string
        default: ""
      pr_number:
        description: "Optional PR number for summary/comment metadata when not using pr_link"
        required: false
        type: string
        default: ""
      pr_url:
        description: "Optional PR URL for summary/comment metadata when not using pr_link"
        required: false
        type: string
        default: ""
      label_name:
        description: Trigger label, used only for summaries
        required: false
        type: string
        default: run-cluster-fuzzer
      run_count:
        description: Number of random fuzzer runs to queue, from 1 to 256
        required: false
        type: number
        default: 10

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  # Lightweight guard keyed off the resolved target. The resolve-inputs
  # job is cheap (no build); once it finishes, the expensive build and
  # final summarize path carry their own concurrency group derived from the
  # canonical repository + ref so that different URL variants for the
  # same PR always serialize correctly.
  group: valkey-pr-fuzzer-${{ inputs.pr_link || format('{0}-{1}', inputs.valkey_repository || 'valkey-io/valkey', inputs.pr_number != '' && format('pr-{0}', inputs.pr_number) || inputs.valkey_ref || 'pending') }}
  cancel-in-progress: false

jobs:
  resolve-inputs:
    name: Resolve inputs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      valkey_repository: ${{ steps.resolve.outputs.valkey_repository }}
      valkey_ref: ${{ steps.resolve.outputs.valkey_ref }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      pr_url: ${{ steps.resolve.outputs.pr_url }}
      concurrency_key: ${{ steps.resolve.outputs.concurrency_key }}
      fuzzer_repository: ${{ steps.fuzzer_source.outputs.repository }}
      fuzzer_ref: ${{ steps.fuzzer_source.outputs.ref }}
    steps:
      # A called workflow's github.repository and github.sha are its caller's,
      # so a caller passes fuzzer_repository and fuzzer_ref. Without a ref,
      # checkout takes this run's commit, or another repository's default branch.
      - name: Checkout valkey-fuzzer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.fuzzer_repository || github.repository }}
          ref: ${{ inputs.fuzzer_ref }}
          persist-credentials: false

      # Every later job checks out this commit, so all of them run the same fuzzer.
      - name: Resolve fuzzer source
        id: fuzzer_source
        env:
          REPOSITORY: ${{ inputs.fuzzer_repository || github.repository }}
          INPUT_FUZZER_REF: ${{ inputs.fuzzer_ref }}
        run: |
          echo "repository=${REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "ref=${INPUT_FUZZER_REF:-$(git rev-parse HEAD)}" >> "$GITHUB_OUTPUT"

      - name: Resolve PR link and inputs
        id: resolve
        env:
          INPUT_PR_LINK: ${{ inputs.pr_link }}
          INPUT_VALKEY_REPOSITORY: ${{ inputs.valkey_repository }}
          INPUT_VALKEY_REF: ${{ inputs.valkey_ref }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_PR_URL: ${{ inputs.pr_url }}
        run: python .github/scripts/ci.py resolve >> "$GITHUB_OUTPUT"

  prepare-matrix:
    needs:
      - resolve-inputs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      run_count: ${{ steps.matrix.outputs.run_count }}
      runs: ${{ steps.matrix.outputs.runs }}
    steps:
      - name: Checkout valkey-fuzzer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ needs.resolve-inputs.outputs.fuzzer_repository }}
          ref: ${{ needs.resolve-inputs.outputs.fuzzer_ref }}
          persist-credentials: false

      - name: Build matrix
        id: matrix
        env:
          RUN_COUNT: ${{ inputs.run_count }}
        run: python .github/scripts/ci.py matrix >> "$GITHUB_OUTPUT"

  build-valkey:
    name: Build Valkey
    needs:
      - resolve-inputs
      - prepare-matrix
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ needs.resolve-inputs.outputs.concurrency_key }}
      cancel-in-progress: false
    outputs:
      resolved_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout Valkey
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ needs.resolve-inputs.outputs.valkey_repository }}
          ref: ${{ needs.resolve-inputs.outputs.valkey_ref }}
          fetch-depth: 1
          path: valkey-src
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev tcl

      - name: Build Valkey
        working-directory: valkey-src
        run: |
          make -j"$(nproc)"
          src/valkey-server --version

      - name: Capture resolved SHA
        id: commit
        working-directory: valkey-src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package Valkey binaries
        run: |
          mkdir -p valkey-binaries
          cp valkey-src/src/valkey-server valkey-binaries/
          cp valkey-src/src/valkey-cli valkey-binaries/
          cp valkey-src/src/valkey-benchmark valkey-binaries/

          if [ -f valkey-src/src/modules/lua/libvalkeylua.so ]; then
            cp valkey-src/src/modules/lua/libvalkeylua.so valkey-binaries/
          fi

      - name: Upload Valkey binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: valkey-pr-binaries
          if-no-files-found: error
          path: valkey-binaries/

  random-fuzzer:
    name: Random fuzzer run ${{ matrix.run_id }}
    needs:
      - resolve-inputs
      - prepare-matrix
      - build-valkey
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: ${{ needs.resolve-inputs.outputs.concurrency_key }}-run-${{ matrix.run_id }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.runs) }}
    steps:
      - name: Checkout valkey-fuzzer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ needs.resolve-inputs.outputs.fuzzer_repository }}
          ref: ${{ needs.resolve-inputs.outputs.fuzzer_ref }}
          persist-credentials: false

      - name: Download Valkey binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: valkey-pr-binaries
          path: ${{ runner.temp }}/valkey-binaries

      - name: Install Valkey binaries
        run: chmod +x "${{ runner.temp }}/valkey-binaries/"*

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install valkey-fuzzer
        id: setup
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Execute fuzzer run
        id: execute
        env:
          RUN_ID: ${{ matrix.run_id }}
          RUN_DIR: ${{ runner.temp }}/valkey-pr-fuzzer/run-${{ matrix.run_id }}
          VALKEY_BINARY: ${{ runner.temp }}/valkey-binaries/valkey-server
          LD_LIBRARY_PATH: ${{ runner.temp }}/valkey-binaries
        run: |
          set -o pipefail
          mkdir -p "${RUN_DIR}"
          # One fresh seed through the batch runner: batch/ holds summary.json and the
          # run folder runs/<id>/ (report.json, scenario.yaml, logs/), as the scheduled run uploads.
          valkey-fuzzer batch \
            --random valkey.cluster-chaos \
            --seeds 1 \
            --valkey-binary "${VALKEY_BINARY}" \
            --batch-id "pr-run-${RUN_ID}" \
            --out "${RUN_DIR}/batch" \
            2>&1 | tee "${RUN_DIR}/console.log"

      - name: Write run metadata
        if: always()
        env:
          RUN_ID: ${{ matrix.run_id }}
          RUN_DIR: ${{ runner.temp }}/valkey-pr-fuzzer/run-${{ matrix.run_id }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          FUZZER_OUTCOME: ${{ steps.execute.outcome }}
        run: python .github/scripts/ci.py metadata

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: valkey-pr-fuzzer-run-${{ matrix.run_id }}
          if-no-files-found: error
          path: ${{ runner.temp }}/valkey-pr-fuzzer/run-${{ matrix.run_id }}

  summarize:
    name: Summarize cluster fuzzer results
    # Without resolved inputs there is no fuzzer to check out and no PR to report to.
    if: ${{ always() && needs.resolve-inputs.result == 'success' }}
    needs:
      - resolve-inputs
      - prepare-matrix
      - build-valkey
      - random-fuzzer
    permissions:
      contents: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ needs.resolve-inputs.outputs.concurrency_key }}
      cancel-in-progress: false
    steps:
      - name: Checkout valkey-fuzzer
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ needs.resolve-inputs.outputs.fuzzer_repository }}
          ref: ${{ needs.resolve-inputs.outputs.fuzzer_ref }}
          persist-credentials: false

      - name: Download run artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: valkey-pr-fuzzer-run-*
          path: collected-results

      - name: Write workflow summary
        id: summary
        env:
          RESULTS_DIR: collected-results
          PREPARE_MATRIX_RESULT: ${{ needs.prepare-matrix.result }}
          RUN_COUNT: ${{ needs.prepare-matrix.outputs.run_count }}
          BUILD_RESULT: ${{ needs.build-valkey.result }}
          RESOLVED_SHA: ${{ needs.build-valkey.outputs.resolved_sha }}
          FUZZER_REPOSITORY: ${{ needs.resolve-inputs.outputs.fuzzer_repository }}
          FUZZER_REF: ${{ needs.resolve-inputs.outputs.fuzzer_ref }}
          VALKEY_REPOSITORY: ${{ needs.resolve-inputs.outputs.valkey_repository }}
          VALKEY_REF: ${{ needs.resolve-inputs.outputs.valkey_ref }}
          PR_NUMBER: ${{ needs.resolve-inputs.outputs.pr_number }}
          PR_URL: ${{ needs.resolve-inputs.outputs.pr_url }}
          LABEL_NAME: ${{ inputs.label_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python .github/scripts/ci.py summarize

      - name: Comment on PR with fuzzer results
        if: ${{ needs.resolve-inputs.outputs.pr_number != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.resolve-inputs.outputs.pr_number }}
          VALKEY_REPOSITORY: ${{ needs.resolve-inputs.outputs.valkey_repository }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr-comment.md', 'utf8');
            // ci.py summarize writes the marker as the comment's first line.
            const marker = body.split('\n', 1)[0];
            const issue_number = Number(process.env.PR_NUMBER);
            const valkey_repository = process.env.VALKEY_REPOSITORY;
            const [target_owner, target_repo] = valkey_repository.split('/');
            const {owner: workflow_owner, repo: workflow_repo} = context.repo;

            // The GITHUB_TOKEN only has permissions on the workflow repo.
            // When the PR lives in a different repository (e.g. valkey-io/valkey
            // while the workflow runs in valkey-io/valkey-fuzzer), skip commenting
            // because the token cannot access the target repo.
            if (target_owner !== workflow_owner || target_repo !== workflow_repo) {
              core.info(
                `Skipping PR comment: PR is in ${valkey_repository} but workflow ` +
                `is running in ${workflow_owner}/${workflow_repo}`
              );
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: target_owner,
              repo: target_repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: target_owner,
                repo: target_repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: target_owner,
                repo: target_repo,
                issue_number,
                body,
              });
            }

      - name: Fail when a run failed or is missing
        if: steps.summary.outputs.overall_failed == 'true'
        run: exit 1
