# Forkless BGSAVE on a standalone node under renames, compressed-list reads, and a stray EXEC.
#   valkey-fuzzer run examples/valkey/forkless_save_churn.yaml --output report.json
scenario_id: forkless-save-churn
seed: 123
experiment:
  id: valkey.forkless-save-churn
  inputs:
    stable_keys: 2000
    mutation_rate: 500
    list_length: 50000
deployment:
  mode: standalone
  base_port: 7480
