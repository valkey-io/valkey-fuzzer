# Same seeded workload on a baseline and a candidate build: every client
# reply, the final dataset, and the reloaded snapshot must match.
# Point the two artifacts at the builds you want to compare.
differential_id: baseline-vs-candidate
base:
  scenario_id: build-equivalence
  seed: 77
  artifacts:
    baseline:
      use: valkey.artifact.local-binary
      with: {path: /opt/valkey-8.1/src/valkey-server}
    candidate:
      use: valkey.artifact.local-binary
      with: {path: /opt/valkey/src/valkey-server}
  experiment:
    id: valkey.snapshot-equivalence
    inputs: {operations: 3000}
  deployment:
    mode: cluster
    base_port: 7640
variants:
  baseline:
    deployment.valkey_binary: {$ref: artifacts.baseline.binary}
  candidate:
    deployment.valkey_binary: {$ref: artifacts.candidate.binary}
compare:
  equal:
    - {evidence_id: valkey.dataset.digest, source: dataset, field: digest}
    - {evidence_id: valkey.rdb.reload-verified, source: snapshot, field: content_digest}
    - {evidence_id: valkey.workload.ledger, source: writes, field: replies_digest}
